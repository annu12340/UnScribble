<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Protein Mechanism</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 1rem;
    }
    .test-section {
      margin: 2rem 0;
      padding: 1rem;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .success { background: #d4edda; }
    .error { background: #f8d7da; }
    button {
      padding: 0.5rem 1rem;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    pre {
      background: #f5f5f5;
      padding: 1rem;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Protein Mechanism Test Page</h1>
  
  <div class="test-section">
    <h2>Test 1: API Endpoint</h2>
    <button onclick="testAPI()">Test API</button>
    <div id="api-result"></div>
  </div>
  
  <div class="test-section">
    <h2>Test 2: Three.js Loading</h2>
    <div id="threejs-result"></div>
  </div>
  
  <div class="test-section">
    <h2>Test 3: Available Medications</h2>
    <ul>
      <li><a href="/medication-mechanism.html?medication=lisinopril">Lisinopril</a></li>
      <li><a href="/medication-mechanism.html?medication=atorvastatin">Atorvastatin</a></li>
      <li><a href="/medication-mechanism.html?medication=metformin">Metformin</a></li>
      <li><a href="/medication-mechanism.html?medication=omeprazole">Omeprazole</a></li>
      <li><a href="/medication-mechanism.html?medication=aspirin">Aspirin (no data)</a></li>
    </ul>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Test Three.js loading
    window.addEventListener('load', () => {
      const result = document.getElementById('threejs-result');
      if (typeof THREE !== 'undefined') {
        result.innerHTML = '<p class="success">✓ THREE.js loaded successfully (version r' + THREE.REVISION + ')</p>';
      } else {
        result.innerHTML = '<p class="error">✗ THREE.js failed to load</p>';
      }
    });
    
    // Test API
    async function testAPI() {
      const resultDiv = document.getElementById('api-result');
      resultDiv.innerHTML = '<p>Testing...</p>';
      
      try {
        const response = await fetch('/api/protein-mechanism', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ medication: 'lisinopril' })
        });
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        resultDiv.innerHTML = `
          <p class="success">✓ API working</p>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
      } catch (error) {
        resultDiv.innerHTML = `<p class="error">✗ API failed: ${error.message}</p>`;
      }
    }
  </script>
</body>
</html>

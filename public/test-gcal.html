<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Calendar API Test</title>
    <link rel="stylesheet" href="/test-gcal.css">
</head>
<body>
    <h1>Google Calendar API Test</h1>
    <p>This page helps diagnose Google Calendar integration issues.</p>

    <div class="test-section">
        <h2>Step 1: Load Configuration</h2>
        <button id="loadConfigBtn">Load Config from Server</button>
        <div id="configResult"></div>
    </div>

    <div class="test-section">
        <h2>Step 2: Initialize Google API</h2>
        <button id="initGapiBtn">Initialize Google API</button>
        <div id="gapiResult"></div>
    </div>

    <div id="g_id_onload"
         data-client_id=""
         data-callback="handleCredentialResponse"
         style="display: none;">
    </div>

    <div class="test-section">
        <h2>Step 3: Sign In</h2>
        <button id="signInBtn">Sign In with Google</button>
        <button id="signOutBtn">Sign Out</button>
        <div id="authResult"></div>
    </div>

    <div class="test-section">
        <h2>Step 4: Test API Access</h2>
        <button id="testApiKeyBtn">Test API Access</button>
        <div id="apiKeyResult"></div>
    </div>

    <div class="test-section">
        <h2>Console Log</h2>
        <button id="clearLogBtn">Clear Log</button>
        <div id="log" class="log"></div>
    </div>

    <script src="/test-gcal.js"></script>
</body>
</html>
